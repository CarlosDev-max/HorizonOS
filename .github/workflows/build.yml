name: Build HorizonOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            build-essential git
          cmake --version
          arm-none-eabi-gcc --version

      - name: Clone pico-sdk
        run: |
          git clone \
            --recurse-submodules \
            --shallow-submodules \
            --depth=1 \
            --branch 1.5.1 \
            https://github.com/raspberrypi/pico-sdk.git
          echo "pico-sdk OK"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DPICO_BOARD=pico_w \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel $(nproc) 2>&1 | tee build/make_output.txt
          echo "exit:${PIPESTATUS[0]}" >> build/make_output.txt
          ls -lh build/*.uf2 build/*.elf 2>/dev/null || true
          grep -q "exit:0" build/make_output.txt

      - name: Push build log to repo
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "ci@horizonos.local"
          git config user.name "HorizonOS CI"
          LOG=$(cat build/make_output.txt 2>/dev/null || echo "no log")
          python3 - << 'PYEOF'
          import os, json, base64, urllib.request
          token  = os.environ["GITHUB_TOKEN"]
          repo   = "CarlosDev-max/HorizonOS"
          path   = "ci-logs/latest_build.txt"
          log    = open("build/make_output.txt").read() if os.path.exists("build/make_output.txt") else "no log"
          b64    = base64.b64encode(log.encode()).decode()
          url    = f"https://api.github.com/repos/{repo}/contents/{path}"
          req    = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"})
          try:
              existing = json.loads(urllib.request.urlopen(req).read())
              sha = existing["sha"]
          except:
              sha = None
          payload = {"message": "ci: update build log", "content": b64, "branch": "main"}
          if sha:
              payload["sha"] = sha
          req2 = urllib.request.Request(url, data=json.dumps(payload).encode(), method="PUT",
                    headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json", "Accept": "application/vnd.github+json"})
          try:
              result = json.loads(urllib.request.urlopen(req2).read())
              print("Log pushed:", result.get("content", {}).get("path"))
          except Exception as e:
              print("Push failed:", e)
          PYEOF

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 scripts/publish_release.py \
            build/horizonos.uf2 \
            build/horizonos.elf
  build-sim:
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build Windows simulator (GDI, zero external deps)
        run: |
          x86_64-w64-mingw32-gcc -O2 -std=c11 -Wall \
            -I src -I src/hal -I src/gui -I src/kernel \
            -I src/services -I src/apps \
            -I sim/stubs -I sim/hal \
            -D_WIN32_WINNT=0x0601 \
            sim/sim_gdi.c \
            sim/sim_stubs_win.c \
            sim/hal/input_sim.c \
            sim/hal/sound_sim.c \
            sim/hal/touch_sim.c \
            sim/hal/wifi_sim.c \
            src/kernel/scheduler.c \
            src/kernel/memory.c \
            src/kernel/shell.c \
            src/kernel/fs.c \
            src/gui/window_manager.c \
            src/gui/widgets.c \
            src/services/event_bus.c \
            src/services/app_manager.c \
            src/apps/home.c \
            src/apps/files.c \
            src/apps/settings.c \
            src/apps/network.c \
            -o horizonos_sim.exe \
            -mwindows -lgdi32 -luser32 \
            2>&1 | tee /tmp/sim_build.txt
          EXIT=${PIPESTATUS[0]}
          ls -lh horizonos_sim.exe 2>/dev/null || true
          exit $EXIT

      - name: Push build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/push_log.py /tmp/sim_build.txt ci-logs/sim_build.txt

      - name: Add sim to release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload dev horizonos_sim.exe --clobber
          echo "horizonos_sim.exe uploaded (standalone, no DLLs needed)"
