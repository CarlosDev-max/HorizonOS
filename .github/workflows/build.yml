name: Build HorizonOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            build-essential git
          cmake --version
          arm-none-eabi-gcc --version

      - name: Clone pico-sdk (with all submodules)
        run: |
          # Clone SDK with all submodules in one step (more reliable than two-step)
          git clone \
            --recurse-submodules \
            --shallow-submodules \
            --depth=1 \
            --branch 1.5.1 \
            https://github.com/raspberrypi/pico-sdk.git
          echo "pico-sdk OK — $(ls pico-sdk/src | wc -l) source dirs"

      - name: Configure (CMake)
        run: |
          mkdir -p build
          cmake -S . -B build \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DPICO_BOARD=pico_w \
            -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee build/cmake_output.txt
          echo "CMake exit: $?"

      - name: Build
        run: |
          cmake --build build --parallel $(nproc) \
            2>&1 | tee build/make_output.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizonos-build
          path: |
            build/cmake_output.txt
            build/make_output.txt
            build/*.uf2
            build/*.elf
