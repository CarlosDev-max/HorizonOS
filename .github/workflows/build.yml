name: Build HorizonOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            build-essential git
          cmake --version
          arm-none-eabi-gcc --version

      - name: Clone pico-sdk
        run: |
          git clone \
            --recurse-submodules \
            --shallow-submodules \
            --depth=1 \
            --branch 1.5.1 \
            https://github.com/raspberrypi/pico-sdk.git
          echo "pico-sdk OK"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DPICO_BOARD=pico_w \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel $(nproc) 2>&1 | tee build/make_output.txt
          echo "exit:${PIPESTATUS[0]}" >> build/make_output.txt
          ls -lh build/*.uf2 build/*.elf 2>/dev/null || true
          grep -q "exit:0" build/make_output.txt

      - name: Push build log to repo
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "ci@horizonos.local"
          git config user.name "HorizonOS CI"
          LOG=$(cat build/make_output.txt 2>/dev/null || echo "no log")
          python3 - << 'PYEOF'
          import os, json, base64, urllib.request
          token  = os.environ["GITHUB_TOKEN"]
          repo   = "CarlosDev-max/HorizonOS"
          path   = "ci-logs/latest_build.txt"
          log    = open("build/make_output.txt").read() if os.path.exists("build/make_output.txt") else "no log"
          b64    = base64.b64encode(log.encode()).decode()
          url    = f"https://api.github.com/repos/{repo}/contents/{path}"
          req    = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"})
          try:
              existing = json.loads(urllib.request.urlopen(req).read())
              sha = existing["sha"]
          except:
              sha = None
          payload = {"message": "ci: update build log", "content": b64, "branch": "main"}
          if sha:
              payload["sha"] = sha
          req2 = urllib.request.Request(url, data=json.dumps(payload).encode(), method="PUT",
                    headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json", "Accept": "application/vnd.github+json"})
          try:
              result = json.loads(urllib.request.urlopen(req2).read())
              print("Log pushed:", result.get("content", {}).get("path"))
          except Exception as e:
              print("Push failed:", e)
          PYEOF

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 scripts/publish_release.py \
            build/horizonos.uf2 \
            build/horizonos.elf
  build-sim:
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install MinGW
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64 cmake

      - name: Download SDL2 for MinGW
        run: |
          # curl -f fails loudly on HTTP errors (wget -q silently saves HTML as a file)
          curl -fsSL \
            "https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-devel-2.28.5-mingw.tar.gz" \
            -o SDL2-mingw.tar.gz
          echo "Downloaded: $(ls -lh SDL2-mingw.tar.gz)"
          file SDL2-mingw.tar.gz
          tar xzf SDL2-mingw.tar.gz
          ls SDL2-2.28.5/x86_64-w64-mingw32/lib/ | head -5
          echo "SDL2_ROOT=$PWD/SDL2-2.28.5/x86_64-w64-mingw32" >> $GITHUB_ENV

      - name: Build Windows simulator
        run: |
          echo "SDL2_ROOT=$SDL2_ROOT"
          ls "$SDL2_ROOT/lib/" | grep SDL2

          cmake sim/ -B build_sim \
            -DCMAKE_TOOLCHAIN_FILE=sim/cmake/mingw64.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL2_INCLUDE_DIR="$SDL2_ROOT/include" \
            -DSDL2_LIBRARY="$SDL2_ROOT/lib/libSDL2.dll.a" \
            -DSDL2_MAIN_LIBRARY="$SDL2_ROOT/lib/libSDL2main.a"

          cmake --build build_sim --parallel $(nproc)
          cp "$SDL2_ROOT/bin/SDL2.dll" build_sim/
          ls -lh build_sim/horizonos_sim.exe build_sim/SDL2.dll

      - name: Add sim to release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload dev \
            build_sim/horizonos_sim.exe \
            build_sim/SDL2.dll \
            --clobber
          echo "Simulator uploaded to release"
