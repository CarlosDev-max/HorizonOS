name: Build HorizonOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            build-essential git
          cmake --version
          arm-none-eabi-gcc --version

      - name: Clone pico-sdk
        run: |
          git clone \
            --recurse-submodules \
            --shallow-submodules \
            --depth=1 \
            --branch 1.5.1 \
            https://github.com/raspberrypi/pico-sdk.git
          echo "pico-sdk OK"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DPICO_BOARD=pico_w \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel $(nproc)
          ls -lh build/*.uf2 build/*.elf

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"

          # Write notes to a file to avoid YAML/bash multiline quoting issues
          cat > /tmp/notes.md << NOTES_EOF
          ## HorizonOS dev build

          **Commit:** ${SHORT_SHA}
          **Built:** ${BUILD_DATE}
          **Board (Wokwi):** Raspberry Pi Pico W

          ### How to test in Wokwi
          1. Download \`horizonos.uf2\` below
          2. Go to [wokwi.com](https://wokwi.com) and create a Raspberry Pi Pico W project
          3. Replace \`diagram.json\` with the one from the [wokwi/](../../tree/main/wokwi) folder
          4. Upload the .uf2 and press Play
          5. **Blue (GP2)** = Navigate left | **Green (GP3)** = Navigate right | **Red (GP4)** = Open app
          NOTES_EOF

          # Delete old dev release/tag if it exists
          gh release delete dev --yes 2>/dev/null || true
          git push origin :refs/tags/dev 2>/dev/null || true

          # Create the new release
          gh release create dev \
            --title "HorizonOS dev — ${SHORT_SHA}" \
            --notes-file /tmp/notes.md \
            --prerelease \
            build/horizonos.uf2 \
            build/horizonos.elf

          echo "Release URL: $(gh release view dev --json url -q .url)"
